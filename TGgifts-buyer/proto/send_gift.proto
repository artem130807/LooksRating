syntax = "proto3";

package tgifts;

service TelegramGiftSenderService {
    rpc SendGift(SendGiftRequest) returns (SendGiftResponse);
}

message SendGiftRequest {
    int64 recipient_telegram_id = 1;
    int32 star_price = 2;
}

message SendGiftResponse {
    bool success = 1;
    string message = 2;
}
