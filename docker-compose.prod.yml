# Production stack for a single VPS (~12 GB RAM, 3 vCPU).
#
# Start (2 API replicas, safe migration order):
#   ./scripts/prod-up.sh
#
# Or manually (skips safe migration order — prefer ./scripts/prod-up.sh):
#   docker compose -f docker-compose.prod.yml up -d --build --scale api=2
#
# API (via nginx gateway): http://<server-ip>:8080
# Internal services (postgres, redis, kafka) are NOT exposed to the host.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart-policy: &default-restart
  restart: unless-stopped

services:
  postgres:
    <<: *default-restart
    image: postgres:16-alpine
    container_name: looksrating-postgres
    environment:
      POSTGRES_DB: LooksRatingDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - looksrating-pgdata:/var/lib/postgresql/data
    mem_limit: 1536m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d LooksRatingDb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - looksrating-internal

  redis:
    <<: *default-restart
    image: redis:7-alpine
    container_name: looksrating-redis
    command: redis-server --save 60 1 --appendonly yes --loglevel warning
    volumes:
      - looksrating-redis-data:/data
    mem_limit: 384m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - looksrating-internal

  zookeeper:
    <<: *default-restart
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: looksrating-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # ruok is disabled by default in ZK 3.5+; required for healthcheck below.
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok"
    mem_limit: 512m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - looksrating-internal

  kafka:
    <<: *default-restart
    image: confluentinc/cp-kafka:7.6.1
    container_name: looksrating-kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    mem_limit: 1536m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - looksrating-internal

  api:
    <<: *default-restart
    build:
      context: .
      dockerfile: LooksRatingApi/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=LooksRatingDb;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Kafka__BootstrapServers: kafka:29092
      KafkaConsumer__PhotoConsume__BootstrapServers: kafka:29092
      KafkaConsumer__SparksCredits__BootstrapServers: kafka:29092
      KafkaConsumer__SparksCompensation__BootstrapServers: kafka:29092
      Security__ApiKey: ${API_KEY:?Set API_KEY in .env}
      Security__RequireApiKey: "true"
    mem_limit: 768m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - looksrating-internal

  api-gateway:
    <<: *default-restart
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: looksrating-api-gateway
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    mem_limit: 128m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - looksrating-internal

  bot:
    <<: *default-restart
    build:
      context: .
      dockerfile: LooksRatingBot/Dockerfile
    container_name: looksrating-bot
    depends_on:
      api-gateway:
        condition: service_healthy
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api-gateway:8080
      API_GRPC_ADDRESS: api:8081
      TGIFTS_GRPC_ADDRESS: tgifts-buyer:50051
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      INTERNAL_NOTIFY_API_KEY: ${INTERNAL_NOTIFY_API_KEY:-${API_KEY:?Set API_KEY in .env}}
      INTERNAL_NOTIFY_PORT: 8092
      BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
    mem_limit: 384m
    logging: *default-logging
    networks:
      - looksrating-internal

  ticket-postgres:
    <<: *default-restart
    image: postgres:16-alpine
    container_name: looksrating-ticket-postgres
    environment:
      POSTGRES_DB: LooksRatingTicketDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TICKET_POSTGRES_PASSWORD:?Set TICKET_POSTGRES_PASSWORD in .env}
    volumes:
      - looksrating-ticket-pgdata:/var/lib/postgresql/data
    mem_limit: 768m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d LooksRatingTicketDb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - looksrating-internal

  ticket-admin-seed:
    build:
      context: ./LooksRatingTicketApi
      dockerfile: Dockerfile
    container_name: looksrating-ticket-admin-seed
    depends_on:
      ticket-postgres:
        condition: service_healthy
    environment:
      TICKET_DATABASE_URL: postgres://postgres:${TICKET_POSTGRES_PASSWORD:?Set TICKET_POSTGRES_PASSWORD in .env}@ticket-postgres:5432/LooksRatingTicketDb?sslmode=disable
    entrypoint: ["/app/ticket-seed-admins"]
    command: ["-file", "/app/data/admins.seed.json"]
    restart: "no"
    logging: *default-logging
    networks:
      - looksrating-internal

  ticket-api:
    <<: *default-restart
    build:
      context: ./LooksRatingTicketApi
      dockerfile: Dockerfile
    container_name: looksrating-ticket-api
    env_file:
      - .env
    depends_on:
      ticket-postgres:
        condition: service_healthy
      ticket-admin-seed:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      TICKET_DATABASE_URL: postgres://postgres:${TICKET_POSTGRES_PASSWORD:?Set TICKET_POSTGRES_PASSWORD in .env}@ticket-postgres:5432/LooksRatingTicketDb?sslmode=disable
      TICKET_HTTP_ADDR: :8090
      TICKET_API_KEY: ${TICKET_API_KEY:?Set TICKET_API_KEY in .env}
      LOOKSRATING_HTTP_BASE_URL: http://api:8080
      LOOKSRATING_GRPC_ADDRESS: api:8081
      LOOKSRATING_API_KEY: ${API_KEY:?Set API_KEY in .env}
      LOOKS_RATING_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      MONITOR_ENABLED: ${MONITOR_ENABLED:-true}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}
      MONITOR_ALERT_COOLDOWN_MINUTES: ${MONITOR_ALERT_COOLDOWN_MINUTES:-30}
      MONITOR_LOG_TAIL_LINES: ${MONITOR_LOG_TAIL_LINES:-100}
      MONITOR_DOCKER_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-looksrating}
      MONITOR_ENABLE_DOCKER_LOGS: ${MONITOR_ENABLE_DOCKER_LOGS:-true}
      MONITOR_TGIFTS_ENABLED: ${MONITOR_TGIFTS_ENABLED:-true}
      MONITOR_TGIFTS_GRPC_ADDR: tgifts-buyer:50051
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 384m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8090/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - looksrating-internal

  ticket-bot:
    <<: *default-restart
    build:
      context: .
      dockerfile: LooksRatingTicketBot/Dockerfile
    container_name: looksrating-ticket-bot
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ticket-api:
        condition: service_healthy
      api:
        condition: service_healthy
      bot:
        condition: service_started
    env_file:
      - .env
    environment:
      TICKET_BOT_TOKEN: ${TICKET_BOT_TOKEN:?Set TICKET_BOT_TOKEN in .env}
      LOOKS_RATING_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      TICKET_API_BASE_URL: http://ticket-api:8090
      LOOKS_RATING_API_GRPC_ADDRESS: api:8081
      LOOKS_RATING_API_KEY: ${API_KEY:?Set API_KEY in .env}
      LOOKS_RATING_BOT_NOTIFY_BASE_URL: http://bot:8092
      INTERNAL_NOTIFY_API_KEY: ${INTERNAL_NOTIFY_API_KEY:-${API_KEY:?Set API_KEY in .env}}
      TICKET_API_KEY: ${TICKET_API_KEY:?Set TICKET_API_KEY in .env}
    mem_limit: 256m
    logging: *default-logging
    networks:
      - looksrating-internal

  tgifts-buyer:
    <<: *default-restart
    build:
      context: .
      dockerfile: TGgifts-buyer/Dockerfile
    container_name: looksrating-tgifts-buyer
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ./TGgifts-buyer/.env
    environment:
      LOOKSRATING_GRPC_ADDRESS: api:8081
      APP_MODE: ${TGIFTS_APP_MODE:-gift_grpc}
      CHANNEL_ID: ${TGIFTS_CHANNEL_ID:-0}
      GIFT_GRPC_ENABLED: "true"
      GIFT_GRPC_HOST: 0.0.0.0
      GIFT_GRPC_PORT: 50051
    volumes:
      - ./TGgifts-buyer/data:/app/data
    mem_limit: 384m
    logging: *default-logging
    networks:
      - looksrating-internal

volumes:
  looksrating-pgdata:
  looksrating-ticket-pgdata:
  looksrating-redis-data:

networks:
  looksrating-internal:
    driver: bridge
