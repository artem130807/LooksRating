syntax = "proto3";

option csharp_namespace = "LooksRatingGrpc";
option go_package = "looksrating/ticketapi/internal/gen/ticketspb;ticketspb";

package looksrating.tickets.v1;

service AdminTicketService {
  rpc ListModerationCities(ListModerationCitiesRequest) returns (ListModerationCitiesResponse);
  rpc ListTicketsByCity(ListTicketsByCityRequest) returns (ListTicketsByCityResponse);
  rpc GetTicketDetail(GetTicketDetailRequest) returns (TicketDetail);
  rpc DismissTicket(DismissTicketRequest) returns (DismissTicketResponse);
  rpc DeleteReportedProfile(DeleteReportedProfileRequest) returns (DeleteReportedProfileResponse);
}

message ListModerationCitiesRequest {}

message ListModerationCitiesResponse {
  repeated string cities = 1;
}

message ListTicketsByCityRequest {
  string city = 1;
  int32 offset = 2;
  int32 limit = 3;
}

message TicketSummary {
  string ticket_id = 1;
  string photo_profile_id = 2;
  string description = 3;
  int64 occured_at_unix = 4;
  int64 reporter_telegram_id = 5;
  string reporter_display_name = 6;
  string profile_city = 7;
  string profile_display_name = 8;
  int32 profile_age = 9;
  string profile_gender = 10;
  double profile_rating = 11;
  int32 profile_rating_count = 12;
  string profile_rank = 13;
}

message ListTicketsByCityResponse {
  repeated TicketSummary tickets = 1;
  int32 total_count = 2;
}

message TicketPhoto {
  string photo_id = 1;
  string telegram_file_id = 2;
  int32 sort_order = 3;
}

message GetTicketDetailRequest {
  string ticket_id = 1;
}

message TicketDetail {
  string ticket_id = 1;
  string description = 2;
  int64 occured_at_unix = 3;
  int64 reporter_telegram_id = 4;
  string reporter_display_name = 5;
  string reporter_city = 6;
  string photo_profile_id = 7;
  string profile_display_name = 8;
  string profile_city = 9;
  int32 profile_age = 10;
  string profile_gender = 11;
  double profile_rating = 12;
  int32 profile_rating_count = 13;
  string profile_rank = 14;
  repeated TicketPhoto photos = 15;
}

message DismissTicketRequest {
  string ticket_id = 1;
  int64 admin_telegram_id = 2;
}

message DismissTicketResponse {
  bool success = 1;
}

message DeleteReportedProfileRequest {
  string ticket_id = 1;
  int64 admin_telegram_id = 2;
}

message DeleteReportedProfileResponse {
  bool success = 1;
}
