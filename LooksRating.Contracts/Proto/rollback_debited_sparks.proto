syntax = "proto3";

option csharp_namespace = "LooksRatingGrpc";

service RollBackDebitedSparksService {
    rpc RollBackDebitedSparks(RollBackDebitedSparksRequest) returns (RollBackDebitedSparksResponse);
}

message RollBackDebitedSparksRequest {
    int64 telegram_id = 1;
    int32 stars_count = 2;
    string reason = 3;
}

message RollBackDebitedSparksResponse {
    bool success = 1;
    string message = 2;
}
