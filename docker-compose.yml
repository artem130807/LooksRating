# Локальная разработка / staging (НЕ для открытого интернета):
#   docker compose up -d --build --scale api=2
#
# Production на VPS — используйте docker-compose.prod.yml:
#   ./scripts/prod-up.sh

services:
  postgres:
    image: postgres:16-alpine
    container_name: looksrating-postgres
    environment:
      POSTGRES_DB: LooksRatingDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - looksrating-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d LooksRatingDb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: looksrating-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: looksrating-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok"
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: looksrating-kafka
    hostname: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: LooksRatingApi/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=LooksRatingDb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Kafka__BootstrapServers: kafka:29092
      KafkaConsumer__PhotoConsume__BootstrapServers: kafka:29092
      KafkaConsumer__SparksCredits__BootstrapServers: kafka:29092
      KafkaConsumer__SparksCompensation__BootstrapServers: kafka:29092
      Security__ApiKey: ${API_KEY:-default_secret_api_key}
      Security__RequireApiKey: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  api-gateway:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: looksrating-api-gateway
    depends_on:
      - api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  bot:
    build:
      context: .
      dockerfile: LooksRatingBot/Dockerfile
    container_name: looksrating-bot
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api-gateway:8080
      API_GRPC_ADDRESS: api:8081
      TGIFTS_GRPC_ADDRESS: tgifts-buyer:50051
      API_KEY: ${API_KEY:-default_secret_api_key}
      INTERNAL_NOTIFY_API_KEY: ${INTERNAL_NOTIFY_API_KEY:-${API_KEY:-default_secret_api_key}}
      INTERNAL_NOTIFY_PORT: 8092
      REDIS_URL: redis://redis:6379/0
      BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
    ports:
      - "8092:8092"

  ticket-postgres:
    image: postgres:16-alpine
    container_name: looksrating-ticket-postgres
    environment:
      POSTGRES_DB: LooksRatingTicketDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TICKET_POSTGRES_PASSWORD:-postgres}
    volumes:
      - looksrating-ticket-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d LooksRatingTicketDb"]
      interval: 5s
      timeout: 5s
      retries: 10

  ticket-admin-seed:
    build:
      context: ./LooksRatingTicketApi
      dockerfile: Dockerfile
    container_name: looksrating-ticket-admin-seed
    depends_on:
      ticket-postgres:
        condition: service_healthy
    environment:
      TICKET_DATABASE_URL: postgres://postgres:${TICKET_POSTGRES_PASSWORD:-postgres}@ticket-postgres:5432/LooksRatingTicketDb?sslmode=disable
    entrypoint: ["/app/ticket-seed-admins"]
    command: ["-file", "/app/data/admins.seed.json"]
    restart: "no"

  ticket-api:
    build:
      context: ./LooksRatingTicketApi
      dockerfile: Dockerfile
    container_name: looksrating-ticket-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      ticket-postgres:
        condition: service_healthy
      ticket-admin-seed:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      TICKET_DATABASE_URL: postgres://postgres:${TICKET_POSTGRES_PASSWORD:-postgres}@ticket-postgres:5432/LooksRatingTicketDb?sslmode=disable
      TICKET_HTTP_ADDR: :8090
      TICKET_API_KEY: ${TICKET_API_KEY:?Set TICKET_API_KEY in .env}
      LOOKSRATING_HTTP_BASE_URL: http://api:8080
      LOOKSRATING_GRPC_ADDRESS: api:8081
      LOOKSRATING_API_KEY: ${API_KEY:-default_secret_api_key}
      LOOKS_RATING_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      MONITOR_ENABLED: ${MONITOR_ENABLED:-true}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}
      MONITOR_ALERT_COOLDOWN_MINUTES: ${MONITOR_ALERT_COOLDOWN_MINUTES:-30}
      MONITOR_LOG_TAIL_LINES: ${MONITOR_LOG_TAIL_LINES:-100}
      MONITOR_DOCKER_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-looksrating}
      MONITOR_ENABLE_DOCKER_LOGS: ${MONITOR_ENABLE_DOCKER_LOGS:-true}
      MONITOR_TGIFTS_ENABLED: ${MONITOR_TGIFTS_ENABLED:-true}
      MONITOR_TGIFTS_GRPC_ADDR: tgifts-buyer:50051
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8090/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  ticket-bot:
    build:
      context: .
      dockerfile: LooksRatingTicketBot/Dockerfile
    container_name: looksrating-ticket-bot
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ticket-api:
        condition: service_healthy
      api:
        condition: service_healthy
      bot:
        condition: service_started
    env_file:
      - .env
    environment:
      TICKET_BOT_TOKEN: ${TICKET_BOT_TOKEN:?Set TICKET_BOT_TOKEN in .env}
      LOOKS_RATING_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      TICKET_API_BASE_URL: http://ticket-api:8090
      LOOKS_RATING_API_GRPC_ADDRESS: api:8081
      LOOKS_RATING_API_KEY: ${API_KEY:-default_secret_api_key}
      LOOKS_RATING_BOT_NOTIFY_BASE_URL: http://bot:8092
      INTERNAL_NOTIFY_API_KEY: ${INTERNAL_NOTIFY_API_KEY:-${API_KEY:-default_secret_api_key}}
      TICKET_API_KEY: ${TICKET_API_KEY:?Set TICKET_API_KEY in .env}

  tgifts-buyer:
    build:
      context: .
      dockerfile: TGgifts-buyer/Dockerfile
    container_name: looksrating-tgifts-buyer
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ./TGgifts-buyer/.env
    ports:
      - "50051:50051"
    environment:
      LOOKSRATING_GRPC_ADDRESS: api:8081
      APP_MODE: ${TGIFTS_APP_MODE:-gift_grpc}
      CHANNEL_ID: ${TGIFTS_CHANNEL_ID:-0}
      GIFT_GRPC_ENABLED: "true"
      GIFT_GRPC_HOST: 0.0.0.0
      GIFT_GRPC_PORT: 50051
    volumes:
      - ./TGgifts-buyer/data:/app/data

volumes:
  looksrating-pgdata:
  looksrating-ticket-pgdata:
